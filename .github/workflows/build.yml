name: Build companion versions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Ptarget=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
  build-26:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p minecraft26 build -Ptarget=${{ matrix.minecraft }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
